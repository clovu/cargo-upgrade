[package]
authors = ["Clover You <hi@clovu.me>"]
categories = [
  "development-tools::cargo-plugins",
  "command-line-utilities",
  "command-line-interface",
]
description = "A Cargo subcommand inspired by pnpm upgrade for refreshing dependency requirements in Cargo.toml."
edition = "2024"
exclude = [
  "/.DS_Store",
  "/.editorconfig",
  "/.github/",
  "/.gitignore",
  "/.vscode/",
  "/target/",
]
keywords = ["cargo", "upgrade", "update", "crate", "dependency", "version"]
license = "MIT"
name = "cargo-upgrade"
readme = "README.md"
repository = "https://github.com/clovu/cargo-upgrade"
version = "0.0.1"

[dependencies]
anyhow = "1.0.102"
backon = "1.6.0"
clap = { version = "4.6.7", features = ["derive"] }
futures = "0.3.34"
reqwest = "0.13.5"
semver = { version = "1.0.28", features = ["serde"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.2", features = ["macros", "rt-multi-thread"] }
toml_edit = "0.25.17"
